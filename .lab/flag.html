<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flag motion (Motto-style) — Infinit®</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0C11; --bg:#F4F2F0; --mint:#D8F3D6;
    --sand-1:#F4F2F0; --sand-2:#EBE9E4; --sand-3:#E7E2D9; --sand-4:#DCD5C8; --sand-5:#A89887;
    --sans:"Satoshi",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace; --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0}
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans); }
  .pick{ position:fixed; top:0; left:0; right:0; z-index:40; display:flex; gap:10px; align-items:center;
    padding:14px clamp(18px,3vw,40px); font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:rgba(11,12,17,.55); }

  /* bandera fixa al centre — canvia de color per secció amb onada subtil */
  .flagwrap{ position:fixed; inset:0; display:grid; place-items:center; z-index:1; pointer-events:none; }
  .flag{ width:min(42vw,420px); height:auto; transform-origin:center;
    animation:wave 6s ease-in-out infinite; }
  .flag path{ transition:fill 1s var(--ease); }
  @keyframes wave{ 0%,100%{ transform:rotate(-1deg) skewY(.6deg) } 50%{ transform:rotate(1deg) skewY(-.6deg) } }

  .sec{ position:relative; z-index:2; min-height:100vh; display:flex; align-items:flex-end;
    padding:clamp(28px,6vw,80px); }
  .sec .lbl{ font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:rgba(11,12,17,.55); }
  .sec h2{ font-weight:600; font-size:clamp(28px,4vw,56px); letter-spacing:-.03em; margin-top:8px; }
</style>
</head>
<body>
  <div class="pick"><b style="font-weight:600;color:var(--ink)">Flag motion</b> · scroll · la bandera passa pels beiges (Motto-style)</div>

  <div class="flagwrap">
    <svg class="flag" id="flag" viewBox="0 0 374 206" fill="none" aria-hidden="true">
      <path class="p1" d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z"/>
      <path class="p2" d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" transform="translate(139 0)"/>
    </svg>
  </div>

  <section class="sec" data-a="var(--ink)"   data-b="var(--sand-5)"><div><div class="lbl">01 — Hero</div><h2>Brands built to scale.</h2></div></section>
  <section class="sec" data-a="var(--sand-5)" data-b="var(--sand-4)"><div><div class="lbl">02 — Statement</div><h2>A strategic brand & digital firm.</h2></div></section>
  <section class="sec" data-a="var(--sand-4)" data-b="var(--sand-3)"><div><div class="lbl">03 — Work</div><h2>Selected work.</h2></div></section>
  <section class="sec" data-a="var(--sand-3)" data-b="var(--mint)"><div><div class="lbl">04 — Capabilities</div><h2>Strategy · Identity · Digital.</h2></div></section>
  <section class="sec" data-a="var(--mint)"   data-b="var(--ink)"><div><div class="lbl">05 — Contact</div><h2>Let's talk.</h2></div></section>

<script>
  const flag = document.getElementById('flag');
  const p1 = flag.querySelector('.p1'), p2 = flag.querySelector('.p2');
  const secs = [...document.querySelectorAll('.sec')];
  const io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){
      p1.style.fill = e.target.dataset.a;
      p2.style.fill = e.target.dataset.b;
    }});
  }, { threshold:.5 });
  secs.forEach(s=>io.observe(s));
  // estat inicial
  p1.style.fill = secs[0].dataset.a; p2.style.fill = secs[0].dataset.b;
</script>
</body>
</html>
