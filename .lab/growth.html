<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Built for growth — 10 efectes</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F2F0; --ink:#0B0C11; --grey:rgba(11,12,17,.26); --grey2:rgba(11,12,17,.55);
    --mint:#D8F3D6; --mint-ink:#2F8F66; --mint-deep:#1F6B4A;
    --sans:"Satoshi",system-ui,sans-serif; --serif:"Instrument Serif",serif; --mono:"IBM Plex Mono",monospace;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans); }
  .v{ min-height:100vh; display:flex; flex-direction:column; justify-content:center;
      padding:clamp(28px,6vw,90px); border-top:1px solid rgba(11,12,17,.10); position:relative; overflow:hidden; }
  .lab{ font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--grey2);
        margin-bottom:clamp(24px,4vw,46px); }
  .lab b{ color:var(--ink); font-weight:500; }
  .stmt{ font-weight:700; font-size:clamp(40px,7.2vw,104px); line-height:1.02; letter-spacing:-.03em; max-width:18ch; }
  .stmt .w{ display:inline-block; }
  .dot{ color:var(--mint-ink); }
  .replay{ position:absolute; top:clamp(24px,4vw,46px); right:clamp(24px,4vw,46px);
    font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--grey2);
    border:1px solid rgba(11,12,17,.18); background:none; border-radius:999px; padding:7px 14px; cursor:pointer; }
  .replay:hover{ color:var(--ink); border-color:rgba(11,12,17,.4); }

  /* ===== base ghost grey for most variants ===== */
  .ghost .stmt{ color:var(--grey); }

  /* ===== 01 · MASK REVEAL ===== */
  #v1 .w{ overflow:hidden; padding-bottom:.06em; }
  #v1 .w > i{ font-style:normal; display:inline-block; transform:translateY(112%); transition:transform .85s var(--ease); }
  #v1.in .w > i{ transform:translateY(0); }
  #v1 .stmt{ color:var(--ink); }
  #v1 .hi i{ color:var(--mint-ink); }
  #v1 .w{ transition-delay:0s; }
  #v1.in .w:nth-child(1) i{ transition-delay:.02s } #v1.in .w:nth-child(2) i{ transition-delay:.09s }
  #v1.in .w:nth-child(3) i{ transition-delay:.16s } #v1.in .w:nth-child(4) i{ transition-delay:.30s }
  #v1.in .w:nth-child(5) i{ transition-delay:.37s } #v1.in .w:nth-child(6) i{ transition-delay:.44s }
  #v1.in .w:nth-child(7) i{ transition-delay:.51s }

  /* ===== 02 · MINT SHIMMER ===== */
  #v2 .stmt{ color:transparent; -webkit-background-clip:text; background-clip:text;
    background-image:linear-gradient(100deg, var(--grey) 0%, var(--grey) 38%, var(--mint-ink) 50%, var(--grey) 62%, var(--grey) 100%);
    background-size:240% 100%; background-position:120% 0; animation:shimmer 4.6s var(--ease) infinite; }
  @keyframes shimmer{ to{ background-position:-120% 0; } }

  /* ===== 03 · CURSOR SPOTLIGHT ===== */
  #v3 .wrap{ position:relative; width:max-content; max-width:100%; }
  #v3 .stmt{ color:var(--grey); }
  #v3 .spot{ position:absolute; inset:0; color:var(--mint-ink); pointer-events:none;
    -webkit-mask-image:radial-gradient(circle 160px at var(--mx,-200px) var(--my,-200px), #000 0%, #000 35%, transparent 70%);
            mask-image:radial-gradient(circle 160px at var(--mx,-200px) var(--my,-200px), #000 0%, #000 35%, transparent 70%); }

  /* ===== 04 · BLUR-IN FOCUS ===== */
  #v4 .stmt{ color:var(--ink); }
  #v4 .c{ display:inline-block; filter:blur(16px); opacity:0; transform:translateY(.08em);
    transition:filter .7s var(--ease), opacity .7s var(--ease), transform .7s var(--ease); }
  #v4.in .c{ filter:blur(0); opacity:1; transform:none; }
  #v4 .hi .c{ color:var(--mint-ink); }
  #v4.in .hi{ text-shadow:0 0 26px rgba(47,143,102,.45); transition:text-shadow .9s .5s var(--ease); }

  /* ===== 05 · SCROLL-SCRUB FILL ===== */
  #v5{ min-height:170vh; justify-content:flex-start; }
  #v5 .sticky{ position:sticky; top:0; min-height:100vh; display:flex; align-items:center; }
  #v5 .stmt{ transition:none; }
  #v5 .hi{ position:relative; color:var(--grey); }
  #v5 .hi .fill{ position:absolute; left:0; top:0; color:var(--mint-ink); white-space:nowrap;
    clip-path:inset(0 100% 0 0); }

  /* ===== 06 · MINT WAVE ===== */
  #v6 .stmt{ color:var(--grey); }
  #v6 .c{ display:inline-block; animation:wave 3.2s ease-in-out infinite; }
  @keyframes wave{ 0%,70%,100%{ color:var(--grey); transform:translateY(0);} 35%{ color:var(--mint-ink); transform:translateY(-.06em);} }

  /* ===== 07 · OUTLINE → FILL ===== */
  #v7 .stmt{ color:transparent; -webkit-text-stroke:1.4px var(--grey2); }
  #v7 .c{ display:inline-block; color:transparent; -webkit-text-stroke:1.4px var(--grey2);
    transition:color .6s var(--ease), -webkit-text-stroke-color .6s var(--ease); }
  #v7.in .c{ color:var(--ink); -webkit-text-stroke-color:transparent; }
  #v7.in .hi .c{ color:var(--mint-ink); }

  /* ===== 08 · MINT DUOTONE FILL ===== */
  #v8 .stmt{ color:var(--ink); }
  #v8 .hi{ color:transparent; -webkit-background-clip:text; background-clip:text;
    background-image:linear-gradient(180deg, rgba(47,143,102,.55), rgba(31,107,74,.85)),
      url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1600&auto=format&fit=crop');
    background-size:cover; background-position:center; }

  /* ===== 09 · MINT WIPE ===== */
  #v9 .stmt{ color:var(--ink); clip-path:inset(0 100% 0 0); transition:clip-path 1s var(--ease); }
  #v9.in .stmt{ clip-path:inset(0 0 0 0); }
  #v9 .bar{ position:absolute; top:0; bottom:0; left:0; width:42%;
    background:linear-gradient(90deg, transparent, rgba(216,243,214,.0) 30%, var(--mint) 75%, var(--mint-ink));
    transform:translateX(-120%); pointer-events:none; mix-blend-mode:multiply; }
  #v9.in .bar{ animation:wipe 1.15s var(--ease) forwards; }
  @keyframes wipe{ 0%{transform:translateX(-120%)} 100%{transform:translateX(340%)} }
  #v9 .hi{ color:var(--mint-ink); }

  /* ===== 10 · UNDERLINE DRAW ===== */
  #v10 .stmt{ color:var(--ink); }
  #v10 .hi{ position:relative; }
  #v10 .hi::after{ content:""; position:absolute; left:0; right:0; bottom:.04em; height:.07em; border-radius:2px;
    background:var(--mint-ink); transform:scaleX(0); transform-origin:left; transition:transform .85s .25s var(--ease); }
  #v10.in .hi::after{ transform:scaleX(1); }
</style>
</head>
<body>
<script>
  const STMT = [
    {w:'Built'},{w:'for'},{w:'growth',hi:true,dot:true},
    {w:'Real'},{w:'brands,'},{w:'not'},{w:'noise.'}
  ];
  const META = [
    ['Mask reveal','les paraules pugen darrere una màscara'],
    ['Mint shimmer','degradat mint que travessa el text en bucle'],
    ['Cursor spotlight','focus radial mint que segueix el cursor'],
    ['Blur-in focus','lletres desenfocades → nítides, glow mint'],
    ['Scroll-scrub fill','"growth" s\'omple de mint amb l\'scroll'],
    ['Mint wave','onada de color que recorre les lletres'],
    ['Outline → fill','contorn → ple, "growth" en mint'],
    ['Mint duotone','"growth" amb foto tintada de verd'],
    ['Mint wipe','barra mint que escombra i revela el text'],
    ['Underline draw','línia mint que es dibuixa sota "growth"'],
  ];

  // build a statement node; mode: 'word' | 'char' | 'plain' ; whichHi target gets .hi
  function buildStmt(mode){
    const h = document.createElement('h2'); h.className='stmt';
    STMT.forEach((tok,i)=>{
      const wsp = document.createElement('span'); wsp.className='w'+(tok.hi?' hi':'');
      const text = tok.w + (tok.dot?'':''); // dot handled below
      const word = tok.w;
      if(mode==='word'){
        const inner = document.createElement('i'); inner.textContent = word;
        wsp.appendChild(inner);
        if(tok.dot){ const d=document.createElement('i'); d.className='dot'; d.textContent='.'; wsp.appendChild(d); }
      } else if(mode==='char'){
        [...word].forEach(ch=>{ const c=document.createElement('span'); c.className='c'; c.textContent=ch; wsp.appendChild(c); });
        if(tok.dot){ const c=document.createElement('span'); c.className='c dot'; c.textContent='.'; wsp.appendChild(c); }
      } else {
        wsp.textContent = word + (tok.dot?'.':'');
        if(tok.dot){ wsp.innerHTML = word + '<span class="dot">.</span>'; }
      }
      h.appendChild(wsp);
      if(i<STMT.length-1) h.appendChild(document.createTextNode(' '));
    });
    return h;
  }

  const modes = ['word','plain','plain','char','plain','char','char','plain','plain','plain'];
  const ghost = [false,true,true,false,false,true,false,false,false,false];

  for(let i=0;i<10;i++){
    const sec = document.createElement('section');
    sec.className = 'v'+(ghost[i]?' ghost':''); sec.id='v'+(i+1);
    const lab = document.createElement('span'); lab.className='lab';
    lab.innerHTML = String(i+1).padStart(2,'0')+' · <b>'+META[i][0]+'</b> — '+META[i][1];
    const rep = document.createElement('button'); rep.className='replay'; rep.textContent='Replay ↻';
    rep.onclick = ()=>{ sec.classList.remove('in'); void sec.offsetWidth; sec.classList.add('in'); };
    sec.appendChild(lab); sec.appendChild(rep);

    if(i===2){ // spotlight: wrap + duplicate
      const wrap=document.createElement('div'); wrap.className='wrap';
      const base=buildStmt('plain'); const spot=buildStmt('plain'); spot.classList.add('spot');
      wrap.appendChild(base); wrap.appendChild(spot); sec.appendChild(wrap);
      wrap.addEventListener('pointermove',e=>{ const r=wrap.getBoundingClientRect();
        spot.style.setProperty('--mx',(e.clientX-r.left)+'px'); spot.style.setProperty('--my',(e.clientY-r.top)+'px'); });
      wrap.addEventListener('pointerleave',()=>{ spot.style.setProperty('--mx','-300px'); spot.style.setProperty('--my','-300px'); });
    } else if(i===4){ // scroll-scrub
      const stick=document.createElement('div'); stick.className='sticky';
      const h=buildStmt('plain'); stick.appendChild(h); sec.appendChild(stick);
      const hi=h.querySelector('.hi'); const txt=hi.textContent; hi.textContent='';
      const base=document.createTextNode(txt); hi.appendChild(base);
      const fill=document.createElement('span'); fill.className='fill'; fill.textContent=txt; hi.appendChild(fill);
      addEventListener('scroll',()=>{ const r=sec.getBoundingClientRect(); const tot=sec.offsetHeight-innerHeight;
        let p=Math.min(1,Math.max(0,(-r.top)/tot));
        fill.style.clipPath='inset(0 '+(100-p*100)+'% 0 0)';
        h.style.letterSpacing=(-.03 - p*.012)+'em';
        h.style.transform='scale('+(1+p*.04)+')'; h.style.transformOrigin='left center';
      },{passive:true});
    } else {
      sec.appendChild(buildStmt(modes[i]));
    }
    document.body.appendChild(sec);
  }

  // wave / blur per-char stagger delays
  document.querySelectorAll('#v6 .c').forEach((c,i)=>c.style.animationDelay=(i*0.045)+'s');
  document.querySelectorAll('#v4 .c').forEach((c,i)=>c.style.transitionDelay=(i*0.022)+'s');
  document.querySelectorAll('#v7 .c').forEach((c,i)=>c.style.transitionDelay=(i*0.018)+'s');

  // reveal on view (toggle so scrolling replays)
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting) e.target.classList.add('in'); else e.target.classList.remove('in');
  }),{threshold:.35});
  document.querySelectorAll('.v').forEach(s=>io.observe(s));
</script>
</body>
</html>
