<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinit® — Type study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Manrope:wght@400..800&family=Hanken+Grotesk:wght@400..900&family=Space+Grotesk:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0B0C11; --bg:#F4F2F0; --mono:"IBM Plex Mono",monospace; }
  *{box-sizing:border-box;margin:0}
  body{ background:var(--bg); color:var(--ink); font-family:Satoshi,system-ui,sans-serif; }
  .top{ padding:clamp(24px,4vw,56px) clamp(24px,4vw,56px) 0; }
  .top h1{ font-weight:700; font-size:clamp(24px,2.6vw,38px); letter-spacing:-.03em; }
  .top p{ color:rgba(11,12,17,.55); margin-top:8px; max-width:64ch; }

  .fb{ padding:clamp(28px,4vw,60px); border-top:1px solid rgba(11,12,17,.12); margin-top:clamp(24px,3vw,40px); }
  .fb:first-of-type{ border-top:0; }
  .fname{ font-family:var(--mono); font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:rgba(11,12,17,.5); margin-bottom:22px; }
  .lbl{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; opacity:.5; margin-bottom:14px; }

  .row{ display:grid; gap:14px; margin-bottom:18px; }
  .r3{ grid-template-columns:repeat(3,1fr); }
  @media(max-width:820px){ .r3{ grid-template-columns:1fr; } }

  .logo{ display:flex; align-items:center; gap:11px; }
  .logo svg{ width:30px; height:auto; flex:none; }
  .logo .word{ font-family:var(--f); font-size:clamp(28px,3vw,40px); letter-spacing:-.02em; line-height:1; display:inline-flex; align-items:flex-start; }
  .logo .reg{ font-size:.3em; margin-top:.25em; }

  .card{ border-radius:14px; padding:30px 26px; display:flex; align-items:center; min-height:120px; position:relative; overflow:hidden; }
  .card.dark{ background:var(--ink); color:#fff; }
  .card.gray{ background:var(--bg); color:var(--ink); box-shadow:inset 0 0 0 1px rgba(11,12,17,.12); }
  .card.ink{ background:var(--ink); color:#fff; }
  .card.photo{ color:#fff; }
  .card.photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 25%; }
  .card.photo .scrim{ position:absolute; inset:0; background:rgba(8,8,12,.42); }
  .card.photo .logo{ position:relative; z-index:2; }

  .type{ display:grid; grid-template-columns:1fr 1.2fr; gap:clamp(24px,3vw,56px); margin-top:24px; align-items:start; }
  @media(max-width:820px){ .type{ grid-template-columns:1fr; } }
  .title{ font-family:var(--f); font-weight:800; font-size:clamp(40px,5.2vw,84px); letter-spacing:-.04em; line-height:.94; }
  .long{ font-family:var(--f); font-weight:400; font-size:18px; line-height:1.6; color:rgba(11,12,17,.7); }
  .long b{ font-weight:600; color:var(--ink); }
</style>
</head>
<body>
  <div class="top">
    <h1>Type study — 5 finalistes</h1>
    <p>Cada tipo: 3 logos a pesos diferents · el logo sobre foto fosca / warm-gray / negre ink · i un specimen (títol separat + text llarg). Tot net, sense serif d'accent.</p>
  </div>
  <div id="out"></div>

<script>
  const MARK = `<svg viewBox="0 0 374 206" fill="none" aria-hidden="true"><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor"/><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor" transform="translate(139 0)"/></svg>`;
  const logo = (f,w) => `<div class="logo" style="--f:${f},sans-serif">${MARK}<span class="word" style="font-weight:${w}">infinit<span class="reg">®</span></span></div>`;
  const fonts = [
    ['Satoshi', "'Satoshi'", [600,700,900]],
    ['Inter', "'Inter'", [600,800,900]],
    ['General Sans', "'General Sans'", [500,600,700]],
    ['Manrope', "'Manrope'", [600,700,800]],
    ['Hanken Grotesk', "'Hanken Grotesk'", [600,800,900]],
    ['Space Grotesk', "'Space Grotesk'", [500,600,700]],
  ];
  document.getElementById('out').innerHTML = fonts.map(([n,f,ws],i)=>{
    const big = ws[ws.length-1];
    return `
    <section class="fb">
      <div class="fname">${(i+1).toString().padStart(2,'0')} · ${n}</div>

      <div class="lbl">Logo · pesos ${ws.join(' / ')}</div>
      <div class="row r3">
        ${ws.map(w=>`<div class="card dark">${logo(f,w)}<span style="margin-left:auto;font-family:var(--mono);font-size:11px;opacity:.5">${w}</span></div>`).join('')}
      </div>

      <div class="lbl">Logo sobre · foto fosca / warm-gray / negre ink</div>
      <div class="row r3">
        <div class="card photo"><img src="../project/assets/images/astronaut-red-portrait.png" alt=""><div class="scrim"></div>${logo(f,big)}</div>
        <div class="card gray">${logo(f,big)}</div>
        <div class="card ink">${logo(f,big)}</div>
      </div>

      <div class="type" style="--f:${f},sans-serif">
        <div class="title">Brands<br>built to<br>scale®</div>
        <p class="long"><b>A strategic brand and digital firm</b> for companies navigating growth, transformation and modernization. Strategy connected to execution, identity that scales, digital designed to compound. Real growth, not noise — built through real transformation experience across enterprise, industrial and international work.</p>
      </div>
    </section>`;
  }).join('');
</script>
</body>
</html>
