<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab · accent color</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0B0C11; --bg:#F4F2F0; --ease:cubic-bezier(.22,1,.36,1); }
  *{box-sizing:border-box;margin:0}
  body{ font-family:Inter,system-ui,sans-serif; background:var(--bg); color:var(--ink); padding:clamp(24px,4vw,60px); }
  h1{ font-weight:600; font-size:clamp(22px,2.4vw,30px); letter-spacing:-.02em; }
  .hint{ font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#8a8a90; margin-top:8px; }
  .row{ display:grid; grid-template-columns:200px 1fr 1fr; gap:18px; align-items:stretch; margin-top:18px; }
  @media(max-width:820px){ .row{ grid-template-columns:1fr; } }
  .id{ display:flex; flex-direction:column; justify-content:center; gap:12px; }
  .sw{ width:100%; height:64px; border-radius:12px; box-shadow:inset 0 0 0 1px rgba(11,12,17,.08); }
  .nm{ font-weight:600; font-size:17px; }
  .hex{ font-family:"IBM Plex Mono",monospace; font-size:13px; color:#8a8a90; }
  .card{ border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:16px; min-height:180px; justify-content:center; }
  .card.dark{ background:#15151b; color:#fff; }
  .card.light{ background:#fff; color:var(--ink); box-shadow:inset 0 0 0 1px rgba(11,12,17,.07); }
  .eyebrow{ font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; opacity:.55; }
  .badge{ display:inline-block; font-size:10px; font-weight:700; letter-spacing:.06em; padding:3px 8px; border-radius:8px;
    background:var(--a); color:var(--ink); }
  .line{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .h{ font-weight:600; font-size:20px; letter-spacing:-.02em; }
  .cta{ display:inline-flex; align-items:center; gap:8px; height:42px; padding:0 20px; border-radius:11px;
    background:var(--a); color:var(--ink); font-weight:600; font-size:14px; border:0; cursor:pointer; }
  .view{ height:38px; padding:0 18px; border-radius:11px; font-weight:600; font-size:13px; cursor:pointer; border:0;
    background:rgba(255,255,255,.14); color:#fff; transition:background .25s, color .25s; }
  .card.light .view{ background:rgba(11,12,17,.06); color:var(--ink); }
  .view:hover{ background:var(--a); color:var(--ink); }
  .lnk{ color:var(--a); font-weight:600; text-decoration:none; border-bottom:1px solid currentColor; padding-bottom:1px; }
  .card.light .lnk{ color:color-mix(in srgb, var(--a) 70%, #6b6b55); }
</style>
</head>
<body>
  <h1>Accent color — 5 opcions</h1>
  <p class="hint">Cada accent aplicat sobre mostra fosca i clara · badge NEW · CTA · pill View (hover) · enllaç</p>

  <div id="rows"></div>

<script>
  const colors = [
    ['Cream (actual)',  '#EFE6AE'],
    ['Mint pàl·lid (teu)', '#D8F3D6'],
    ['Mint',            '#A9DCC6'],
    ['Sage',            '#C3D2C0'],
    ['Periwinkle',      '#C2CCF2'],
    ['Clay',            '#E2B79C'],
  ];
  const sample = cls => `
    <div class="card ${cls}">
      <span class="eyebrow">A quick look</span>
      <div class="line"><span class="h">Overview</span><span class="badge">NEW</span></div>
      <div class="line">
        <button class="cta">Start the conversation</button>
        <button class="view">View</button>
        <a class="lnk" href="#">hello@weareinfinit.com</a>
      </div>
    </div>`;
  document.getElementById('rows').innerHTML = colors.map(([n,h],i) => `
    <div class="row" style="--a:${h}">
      <div class="id"><div class="sw" style="background:${h}"></div><div><div class="nm">0${i+1} · ${n}</div><div class="hex">${h}</div></div></div>
      ${sample('dark')}
      ${sample('light')}
    </div>`).join('');
</script>
</body>
</html>
