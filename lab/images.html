<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinit® — Image study (TQ grid)</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0B0C11; --bg:#F4F2F0; --muted:rgba(11,12,17,.5); --gap:clamp(10px,1vw,18px); --mono:"IBM Plex Mono",monospace; }
  *{box-sizing:border-box;margin:0}
  body{ background:var(--bg); color:var(--ink); font-family:Satoshi,system-ui,sans-serif; padding:clamp(20px,3vw,46px); }
  .head{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:clamp(20px,2.4vw,38px); flex-wrap:wrap; }
  h1{ font-weight:700; font-size:clamp(28px,4vw,64px); letter-spacing:-.04em; line-height:.95; }
  h1 em{ font-family:"Instrument Serif",serif; font-style:italic; font-weight:400; }
  .sub{ font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); max-width:42ch; }
  .grid{ display:grid; grid-template-columns:repeat(12,1fr); gap:var(--gap); }
  .tile{ position:relative; overflow:hidden; border-radius:12px; background:#e8e5e1; }
  .tile img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .9s cubic-bezier(.22,1,.36,1); }
  .tile:hover img{ transform:scale(1.04); }
  .cap{ position:absolute; left:16px; bottom:13px; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#fff; mix-blend-mode:difference; }
</style>
</head>
<body>
  <div class="head">
    <h1>Selected <em>imagery.</em></h1>
    <p class="sub">Estudi de direcció d'art · graella editorial TQ · les teves imatges (afegirem aspiracionals d'Unsplash quan em passis links)</p>
  </div>
  <div class="grid" id="grid"></div>

<script>
  const A = '../project/assets/';
  // [path, colSpan, aspect]
  const items = [
    [A+'images/astronaut-red-portrait.png', 7, '16/11'],
    [A+'imagery/ipad-gradient.jpg', 5, '16/11'],
    [A+'imagery/relats-industrial.webp', 5, '4/5'],
    [A+'images/astronaut-pink-full.avif', 4, '4/5'],
    [A+'imagery/device-knob.webp', 3, '4/5'],
    [A+'images/knob-orange.webp', 4, '1/1'],
    [A+'imagery/device-thermos.webp', 4, '1/1'],
    [A+'images/ipad-sunset.webp', 4, '1/1'],
    [A+'imagery/astronaut-blue.avif', 6, '16/10'],
    [A+'images/rainy-day.webp', 6, '16/10'],
    [A+'imagery/almirall-product.webp', 4, '4/5'],
    [A+'imagery/bunnker-product.webp', 4, '4/5'],
    [A+'imagery/raincoat.webp', 4, '4/5'],
    [A+'images/hero-speaker.webp', 12, '21/8'],
    [A+'images/Bunnker Final.webp', 7, '16/10'],
    [A+'images/Relats Brand.webp', 5, '16/10'],
    [A+'imagery/Julia Yosemite.webp', 6, '16/10'],
    [A+'images/astronaut-red-tight.png', 6, '16/10'],
  ];
  document.getElementById('grid').innerHTML = items.map(([src,span,ar],i)=>`
    <a class="tile" style="grid-column:span ${span}; aspect-ratio:${ar}">
      <img src="${encodeURI(src)}" alt="" loading="lazy">
      <span class="cap">${String(i+1).padStart(2,'0')}</span>
    </a>`).join('');
</script>
</body>
</html>
