<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinit® — Header lab</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;900&family=Inter:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F4F2F0;--paper:#FBFAF9;--ink:#0B0C11;--accent:#EFE6AE;--muted:rgba(11,12,17,.55);
   --line:rgba(11,12,17,.11);--sans:"Hanken Grotesk",sans-serif;--mono:"IBM Plex Mono",monospace;
   --ease:cubic-bezier(.22,1,.36,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);
   min-height:100vh;display:flex;flex-direction:column;gap:10px;padding:6vh 0}
  .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
   color:var(--muted);padding:34px clamp(28px,5vw,70px) 8px}
  .hdr{display:flex;align-items:center;justify-content:space-between;
   padding:18px clamp(28px,5vw,70px);border-block:1px solid var(--line);background:var(--paper)}
  .brand{display:inline-flex;align-items:center;gap:9px}
  .brand svg{height:26px}
  .brand .w{font-weight:900;font-size:26px;letter-spacing:-.045em;display:inline-flex;align-items:flex-start;gap:1px}
  .brand .r{font-family:"Inter";font-weight:700;font-size:9px;margin-top:3px}
  .right{display:flex;align-items:center;gap:8px}
  .mbtn{width:46px;height:46px;border:1px solid var(--line);background:var(--paper);
   border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
  .mbtn span{width:18px;height:2px;border-radius:2px;background:var(--ink)}
  .cta{display:inline-flex;align-items:center;height:46px;padding:0 7px 0 20px;font-size:14px;
   font-weight:600;border:1px solid var(--line);border-radius:10px;background:var(--paper);
   color:var(--ink);cursor:pointer;text-decoration:none}
  .cta .tx{padding-right:4px;transition:padding-right .35s var(--ease)}
  .cta .ar{width:0;height:32px;opacity:0;overflow:hidden;display:grid;place-items:center;
   border-radius:8px;background:var(--accent);color:var(--ink);
   box-shadow:inset 0 0 0 1px rgba(11,12,17,.07);transition:width .35s var(--ease),opacity .25s var(--ease)}
  .cta .ar svg{width:15px;height:15px}
  .cta:hover{background:#fff}
  .cta:hover .ar{width:32px;opacity:1}
  .cta:hover .tx{padding-right:20px}
  .lead{display:inline-flex;align-items:center;gap:14px}
</style>
</head>
<body>

<div class="lab">Opció 1 · actual — logo · [≡] [Contact]</div>
<header class="hdr">
  <a class="brand"><svg viewBox="0 0 374 206" fill="none"><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor"/><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor" transform="translate(139 0)"/></svg><span class="w">infinit<span class="r">®</span></span></a>
  <div class="right">
    <button class="mbtn"><span></span><span></span><span></span></button>
    <a class="cta"><span class="tx">Contact</span><span class="ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span></a>
  </div>
</header>

<div class="lab">Opció 2 · swap — logo · [Contact] [≡]</div>
<header class="hdr">
  <a class="brand"><svg viewBox="0 0 374 206" fill="none"><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor"/><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor" transform="translate(139 0)"/></svg><span class="w">infinit<span class="r">®</span></span></a>
  <div class="right">
    <a class="cta"><span class="tx">Contact</span><span class="ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span></a>
    <button class="mbtn"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="lab">Opció 3 · menú amb el logo — [logo  ≡] · [Contact]</div>
<header class="hdr">
  <div class="lead">
    <a class="brand"><svg viewBox="0 0 374 206" fill="none"><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor"/><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor" transform="translate(139 0)"/></svg><span class="w">infinit<span class="r">®</span></span></a>
    <button class="mbtn"><span></span><span></span><span></span></button>
  </div>
  <a class="cta"><span class="tx">Contact</span><span class="ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span></a>
</header>

</body>
</html>
