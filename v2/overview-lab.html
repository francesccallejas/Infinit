<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinit® — Overview lab · 4 modes</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..900&family=Inter:wght@700&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F2F0;--ink:#0B0C11;--deep:#08080C;--muted:rgba(11,12,17,.56);
    --line:rgba(11,12,17,.11);--accent:#EFE6AE;--paper:#FBFAF9;
    --sans:"Hanken Grotesk",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;--ease:cubic-bezier(.22,1,.36,1);
    --edge:clamp(20px,4vw,56px);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  em{font-family:var(--serif);font-style:normal;font-weight:400}

  /* ---- mode selector ---- */
  .mode-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:300;
    display:flex;gap:6px;padding:6px;border-radius:14px;
    background:rgba(11,12,17,.9);backdrop-filter:blur(10px);box-shadow:0 18px 50px -22px rgba(0,0,0,.6)}
  .mode-bar button{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:rgba(244,242,240,.6);
    background:transparent;border:0;padding:9px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.25s var(--ease)}
  .mode-bar button.on{background:var(--accent);color:var(--ink)}
  .mode-note{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:300;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    background:rgba(251,250,249,.8);backdrop-filter:blur(8px);padding:7px 14px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}

  /* ---- nav ---- */
  .nav{position:fixed;top:clamp(20px,3vh,36px);right:var(--edge);z-index:70;display:flex;gap:8px}
  .logo{position:fixed;top:clamp(20px,3vh,36px);left:var(--edge);z-index:70;height:42px;
    display:inline-flex;align-items:center;gap:9px;mix-blend-mode:difference;color:#fff}
  .logo svg{height:26px;width:auto}
  .logo .word{font-weight:900;font-size:26px;letter-spacing:-.045em;line-height:1;display:inline-flex;align-items:flex-start;gap:1px}
  .logo .reg{font-family:"Inter";font-weight:700;font-size:10px;margin-top:3px}
  .nav button,.nav a.btn{height:42px;border:1px solid rgba(11,12,17,.06);background:rgba(251,250,249,.7);
    backdrop-filter:blur(12px);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
    transition:background .25s var(--ease)}
  .nav .cta{padding:0 16px;font-size:14px;font-weight:600}
  .menu-btn{width:42px;flex-direction:column;gap:4px}
  .menu-btn span{width:18px;height:2px;border-radius:2px;background:currentColor;transition:transform .3s var(--ease),opacity .2s}
  .menu-btn.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .menu-btn.open span:nth-child(2){opacity:0}
  .menu-btn.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

  /* ---- floating pill ---- */
  .ov-pill{position:fixed;left:var(--edge);bottom:26px;z-index:66;display:none;align-items:center;gap:0;
    height:48px;padding:0 8px 0 20px;border-radius:14px;border:0;cursor:pointer;
    background:var(--ink);color:var(--bg);font-family:var(--sans);font-size:14px;font-weight:600;
    box-shadow:0 18px 44px -22px rgba(0,0,0,.6);
    opacity:0;transform:translateY(18px);transition:opacity .5s var(--ease),transform .5s var(--ease),background .25s}
  .ov-pill.live{display:inline-flex}
  .ov-pill.show{opacity:1;transform:none}
  .ov-pill .pl-tx{padding-right:12px}
  .ov-pill .pl-ar{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:var(--accent);color:var(--ink);flex:none}
  .ov-pill:hover{background:#000}

  /* ---- overlay (frosted, holds bento) — modes 1,2 ---- */
  .ov-overlay{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;justify-content:center;
    padding:clamp(90px,13vh,150px) var(--edge) clamp(40px,7vh,80px);
    background:rgba(8,8,12,.42);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);
    opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility .5s}
  .ov-overlay.open{opacity:1;visibility:visible}
  .ov-overlay .ov-head{margin-bottom:clamp(22px,3vw,40px);color:var(--bg)}
  .ov-overlay .ov-head .eb{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,242,240,.5);display:block;margin-bottom:12px}
  .ov-overlay .ov-head h2{font-weight:600;font-size:clamp(28px,4vw,60px);letter-spacing:-.035em;line-height:1.04}
  .ov-overlay .ov-bento{max-width:1400px;width:100%;margin-inline:auto}

  /* ---- text panel — modes 3,4 ---- */
  .panel{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;justify-content:center;
    padding:clamp(110px,18vh,200px) var(--edge);background:rgba(244,242,240,.55);
    backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
    opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility .5s}
  .panel.open{opacity:1;visibility:visible}
  .panel a.big{display:block;font-size:clamp(40px,7vw,96px);font-weight:700;letter-spacing:-.035em;line-height:1.12;opacity:.5}
  .panel a.big:hover{opacity:1;color:var(--accent);transform:translateX(10px)}

  /* ---- bento (shared) ---- */
  .ov-bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(130px,16vw,230px);gap:clamp(12px,1.2vw,18px)}
  .ov-card{position:relative;overflow:hidden;border-radius:16px;background:#111219;border:1px solid rgba(244,242,240,.08);
    display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(16px,1.5vw,24px);color:var(--bg)}
  .ov-work{grid-column:1/3;grid-row:1/3}
  .ov-services{grid-column:3/5;grid-row:1;background:var(--accent);color:var(--ink);border-color:transparent}
  .ov-studio{grid-column:3;grid-row:2}
  .ov-claim{grid-column:4;grid-row:2}
  .ov-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:transform .9s var(--ease)}
  .ov-card:hover img{transform:scale(1.05)}
  .ov-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,8,12,0) 38%,rgba(8,8,12,.72) 100%)}
  .ov-label{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
    font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .ov-ar{transition:transform .4s var(--ease)}
  .ov-card:hover .ov-ar{transform:translate(3px,-3px)}
  .ov-svc-list{position:relative;z-index:2;margin-bottom:auto;display:flex;flex-direction:column;gap:2px;
    font-weight:600;font-size:clamp(20px,2.3vw,38px);letter-spacing:-.025em;line-height:1.12}
  .ov-claim h3{position:relative;z-index:2;margin-bottom:auto;font-weight:600;font-size:clamp(18px,1.7vw,28px);letter-spacing:-.03em;line-height:1.06}

  /* inline section (modes 3,4) */
  .overview-inline{display:none;background:var(--deep);color:var(--bg);padding-block:clamp(70px,11vh,150px)}
  .overview-inline.live{display:block}
  .overview-inline .wrap{max-width:1400px;margin-inline:auto;padding-inline:var(--edge)}
  .overview-inline .ov-head{margin-bottom:clamp(30px,4vw,60px)}
  .overview-inline .ov-head .eb{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,242,240,.5);display:block;margin-bottom:14px}
  .overview-inline .ov-head h2{font-weight:600;font-size:clamp(30px,4vw,64px);letter-spacing:-.035em;line-height:1.04}

  /* page filler */
  .hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;padding:0 var(--edge)}
  .hero h1{font-weight:600;font-size:clamp(54px,9vw,150px);letter-spacing:-.05em;line-height:1}
  .hero h1 em{font-family:var(--serif)}
  .filler{padding:clamp(80px,16vh,200px) var(--edge);border-top:1px solid var(--line)}
  .filler h2{font-weight:600;font-size:clamp(30px,4vw,64px);letter-spacing:-.03em}
  .filler.dark{background:var(--ink);color:var(--bg)}
  .spacer{height:30vh}

  @media(max-width:860px){
    .ov-bento{grid-template-columns:1fr 1fr;grid-auto-rows:clamp(130px,40vw,190px)}
    .ov-work{grid-column:1/3;grid-row:auto}
    .ov-services,.ov-studio,.ov-claim{grid-column:auto;grid-row:auto}
  }
</style>
</head>
<body data-mode="1">

<a class="logo"><svg viewBox="0 0 374 206" fill="none"><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor"/><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor" transform="translate(139 0)"/></svg><span class="word">infinit<span class="reg">®</span></span></a>

<nav class="nav">
  <a class="btn cta">Contact</a>
  <button class="menu-btn" id="menuBtn"><span></span><span></span><span></span></button>
</nav>

<!-- floating pill -->
<button class="ov-pill" id="ovPill"><span class="pl-tx">Overview</span><span class="pl-ar"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span></button>

<!-- overlay bento (modes 1,2) -->
<div class="ov-overlay" id="ovOverlay">
  <div class="ov-head"><span class="eb">A quick look</span><h2>One studio, <em>everything connected.</em></h2></div>
  <div class="ov-bento" id="bentoOverlay"></div>
</div>

<!-- text panel (modes 3,4) -->
<div class="panel" id="panel">
  <a class="big">Approach</a><a class="big">Services</a><a class="big">Work</a><a class="big">Studio</a><a class="big">Contact</a>
</div>

<main>
  <section class="hero"><h1>Brands built<br>to <em>scale®.</em></h1></section>

  <section class="filler dark"><h2>Reel / showreel</h2></section>

  <!-- inline overview (modes 3,4) -->
  <section class="overview-inline" id="ovInline">
    <div class="wrap">
      <div class="ov-head"><span class="eb">A quick look</span><h2>One studio, <em>everything connected.</em></h2></div>
      <div class="ov-bento" id="bentoInline"></div>
    </div>
  </section>

  <section class="filler"><h2>Approach</h2></section>
  <section class="filler"><h2>Services</h2></section>
  <section class="filler"><h2>Work</h2></section>
  <div class="spacer"></div>
</main>

<div class="mode-note" id="modeNote"></div>
<div class="mode-bar">
  <button data-m="1" class="on">1 · Menú visual + pill</button>
  <button data-m="2">2 · Només menú visual</button>
  <button data-m="3">3 · Pill + bento inline</button>
  <button data-m="4">4 · Només pill</button>
</div>

<script>
  const bentoHTML = `
    <a class="ov-card ov-work" href="#"><img src="../project/assets/images/Bunnker Final.webp" alt=""><div class="ov-scrim"></div><div class="ov-label"><span>Selected work</span><span class="ov-ar">↗</span></div></a>
    <a class="ov-card ov-services" href="#"><div class="ov-svc-list"><span>Strategy</span><span>Identity</span><span>Digital</span></div><div class="ov-label"><span>Three pillars</span><span class="ov-ar">↗</span></div></a>
    <a class="ov-card ov-studio" href="#"><img src="../project/assets/imagery/francesc.jpg" alt=""><div class="ov-scrim"></div><div class="ov-label"><span>The studio</span><span class="ov-ar">↗</span></div></a>
    <a class="ov-card ov-claim" href="#"><h3>Brands built to <em>scale.</em></h3><div class="ov-label"><span>Our approach</span><span class="ov-ar">↗</span></div></a>`;
  document.getElementById('bentoOverlay').innerHTML = bentoHTML;
  document.getElementById('bentoInline').innerHTML = bentoHTML;

  const body = document.body;
  const menuBtn = document.getElementById('menuBtn');
  const pill = document.getElementById('ovPill');
  const overlay = document.getElementById('ovOverlay');
  const panel = document.getElementById('panel');
  const inline = document.getElementById('ovInline');
  const note = document.getElementById('modeNote');

  const notes = {
    '1':'Mode 1 — hamburguesa obre el BENTO · pill flotant obre el mateix overlay · sense bento al scroll',
    '2':'Mode 2 — hamburguesa obre el BENTO · sense pill · sense bento al scroll',
    '3':'Mode 3 — bento INLINE al scroll · pill flotant hi fa scroll · menú = llista text',
    '4':'Mode 4 — bento INLINE al scroll · pill flotant hi fa scroll · sense overlay'
  };

  function closeAll(){ overlay.classList.remove('open'); panel.classList.remove('open'); menuBtn.classList.remove('open'); }

  function setMode(m){
    body.dataset.mode = m;
    closeAll();
    note.textContent = notes[m];
    document.querySelectorAll('.mode-bar button').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
    // inline bento only in 3,4
    inline.classList.toggle('live', m==='3'||m==='4');
    // pill in 1,3,4
    pill.classList.toggle('live', m!=='2');
    if(m!=='2'){ requestAnimationFrame(()=>pill.classList.add('show')); } else { pill.classList.remove('show'); }
  }

  document.querySelectorAll('.mode-bar button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));

  menuBtn.addEventListener('click',()=>{
    const m = body.dataset.mode;
    const target = (m==='1'||m==='2') ? overlay : panel;
    const open = !target.classList.contains('open');
    closeAll();
    if(open){ target.classList.add('open'); menuBtn.classList.add('open'); }
  });

  pill.addEventListener('click',()=>{
    const m = body.dataset.mode;
    if(m==='1'){ closeAll(); overlay.classList.add('open'); }
    else { closeAll(); inline.scrollIntoView({behavior:'smooth',block:'start'}); }
  });

  // click overlay backdrop to close
  overlay.addEventListener('click',e=>{ if(e.target===overlay) closeAll(); });
  panel.addEventListener('click',e=>{ if(e.target===panel) closeAll(); });

  setMode('1');
</script>
</body>
</html>
