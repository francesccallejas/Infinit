<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinit® — Menu frosted pull-down · 5 tons</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..900&family=Inter:wght@700&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#F4F2F0;--paper:#FBFAF9;--ink:#0B0C11;--accent:#EFE6AE;--muted:rgba(11,12,17,.55);
    --line:rgba(11,12,17,.1);--sans:"Hanken Grotesk",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;--ease:cubic-bezier(.22,1,.36,1);--edge:clamp(24px,5vw,70px);
    /* per-mode (default = cream) */
    --mbg:rgba(244,242,240,.62);--mtx:#0B0C11;--mdim:rgba(11,12,17,.5);--mline:rgba(11,12,17,.12)}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:200vh}
  a{color:inherit;text-decoration:none}

  .logo{position:fixed;top:clamp(20px,3vh,34px);left:var(--edge);z-index:95;height:40px;display:inline-flex;align-items:center;gap:9px;mix-blend-mode:difference;color:#fff}
  .logo svg{height:24px}.logo .w{font-weight:900;font-size:24px;letter-spacing:-.045em}
  .nav{position:fixed;top:clamp(20px,3vh,34px);right:var(--edge);z-index:95;display:flex;gap:8px}
  .nav .btn{height:40px;padding:0 16px;border:1px solid rgba(11,12,17,.08);background:rgba(251,250,249,.75);backdrop-filter:blur(12px);border-radius:10px;display:flex;align-items:center;font-size:14px;font-weight:600;cursor:pointer}
  .menu-btn{width:40px;padding:0;flex-direction:column;gap:4px}
  .menu-btn span{width:17px;height:2px;background:var(--ink);border-radius:2px;transition:.3s var(--ease)}
  .menu-btn.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .menu-btn.open span:nth-child(2){opacity:0}
  .menu-btn.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

  .menu{position:fixed;left:0;right:0;top:0;z-index:80;color:var(--mtx);
    background:var(--mbg);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
    border-bottom:1px solid var(--mline);
    border-bottom-left-radius:30px;border-bottom-right-radius:30px;
    padding:clamp(100px,15vh,160px) var(--edge) clamp(40px,6vh,72px);
    box-shadow:0 40px 90px -50px rgba(10,11,15,.5);
    transform:translateY(-101%);transition:transform .62s var(--ease);will-change:transform}
  .menu.open{transform:translateY(0)}
  .menu-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:clamp(30px,5vw,90px);align-items:end}
  .links{display:flex;flex-direction:column}
  .links a{font-weight:600;font-size:clamp(40px,7vw,96px);letter-spacing:-.04em;line-height:1.12;color:var(--mtx);opacity:.5;transition:opacity .3s var(--ease),transform .3s var(--ease)}
  .links a:hover{opacity:1;transform:translateX(12px)}
  .meta p{color:var(--mdim);font-size:15px;line-height:1.8}
  .meta b{color:var(--mtx);font-weight:600}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mdim);display:block;margin-bottom:14px}

  /* tons */
  body[data-m="1"]{--mbg:rgba(244,242,240,.62);--mtx:#0B0C11;--mdim:rgba(11,12,17,.5);--mline:rgba(11,12,17,.12)}
  body[data-m="2"]{--mbg:rgba(251,250,249,.74);--mtx:#0B0C11;--mdim:rgba(11,12,17,.5);--mline:rgba(11,12,17,.1)}
  body[data-m="3"]{--mbg:rgba(231,226,217,.72);--mtx:#0B0C11;--mdim:rgba(11,12,17,.52);--mline:rgba(11,12,17,.14)}
  body[data-m="4"]{--mbg:rgba(220,213,200,.74);--mtx:#0B0C11;--mdim:rgba(11,12,17,.52);--mline:rgba(11,12,17,.14)}
  body[data-m="5"]{--mbg:rgba(11,12,17,.5);--mtx:#FBFAF9;--mdim:rgba(244,242,240,.55);--mline:rgba(244,242,240,.14)}

  main{padding:0 var(--edge)}
  .hero{min-height:100vh;display:flex;align-items:center}
  .hero h1{font-weight:600;font-size:clamp(54px,10vw,150px);letter-spacing:-.05em;line-height:1}
  .hero h1 em{font-family:var(--serif);font-style:normal}
  .filler{padding:14vh 0;border-top:1px solid var(--line)}
  .filler h2{font-weight:600;font-size:clamp(30px,4vw,64px);letter-spacing:-.03em}

  .modebar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;display:flex;gap:6px;padding:6px;border-radius:13px;background:rgba(11,12,17,.92);box-shadow:0 18px 50px -22px rgba(0,0,0,.6)}
  .modebar button{font-family:var(--mono);font-size:11px;color:rgba(244,242,240,.6);background:transparent;border:0;padding:9px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .modebar button.on{background:var(--accent);color:var(--ink)}
  .modenote{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:120;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:rgba(251,250,249,.85);padding:7px 14px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
</style>
</head>
<body data-m="1">

<a class="logo"><svg viewBox="0 0 374 206" fill="none"><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor"/><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor" transform="translate(139 0)"/></svg><span class="w">infinit</span></a>
<nav class="nav"><a class="btn">Contact</a><button class="btn menu-btn" id="mb"><span></span><span></span><span></span></button></nav>

<div class="menu" id="menu">
  <div class="menu-grid">
    <nav class="links"><a>Approach</a><a>Services</a><a>Work</a><a>Studio</a><a>Contact</a></nav>
    <div class="meta">
      <span class="eyebrow">Infinit®</span>
      <p><b>Brand &amp; Strategy firm</b><br>Barcelona — Worldwide</p>
      <p style="margin-top:18px"><b>hello@weareinfinit.com</b><br>+34 689 022 383</p>
    </div>
  </div>
</div>

<main>
  <section class="hero"><h1>Brands built<br>to <em>scale®.</em></h1></section>
  <section class="filler"><h2>Obre el menú per provar el to</h2></section>
</main>

<div class="modenote" id="note"></div>
<div class="modebar">
  <button data-m="1" class="on">1 · Cream</button>
  <button data-m="2">2 · Paper</button>
  <button data-m="3">3 · Mist</button>
  <button data-m="4">4 · Sand</button>
  <button data-m="5">5 · Dark glass</button>
</div>

<script>
  const body=document.body,menu=document.getElementById('menu'),mb=document.getElementById('mb'),note=document.getElementById('note');
  const notes={'1':'Cream frosted — el to actual del panell',
    '2':'Paper frosted — més clar i net',
    '3':'Mist frosted — warm gray clar (família stack)',
    '4':'Sand frosted — warm gray més marcat',
    '5':'Dark glass — vidre fosc premium, text clar'};
  let open=false;
  const set=o=>{open=o;menu.classList.toggle('open',o);mb.classList.toggle('open',o)};
  mb.addEventListener('click',()=>set(!open));
  menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>set(false)));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});
  function setMode(m){set(false);body.dataset.m=m;note.textContent=notes[m];
    document.querySelectorAll('.modebar button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));}
  document.querySelectorAll('.modebar button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.m)));
  setMode('1');
</script>
</body>
</html>
