<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinit® — logo test</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300..900&family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Hanken Grotesk",sans-serif;display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
  .panel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:80px;padding:60px}
  .white{background:#F4F2F0;color:#08090F}
  .deep{background:#08090F;color:#F3F0EF}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.5}
  .lock{display:inline-flex;align-items:center;gap:9px;color:currentColor}
  .lock svg{height:28px;width:auto}
  .lock .w{font-weight:900;font-size:28px;letter-spacing:-.03em;line-height:1;display:inline-flex;align-items:flex-start;gap:1px}
  .lock .r{font-family:"Inter",sans-serif;font-weight:700;font-size:10px;margin-top:3px}
  .big{gap:16px}
  .big svg{height:96px}
  .big .w{font-size:96px;letter-spacing:-.03em;gap:3px}
  .big .r{font-size:20px;margin-top:8px}
</style>
</head>
<body>
  <div class="panel white">
    <span class="tag">Sobre blanc — header</span>
    <a class="lock"><svg viewBox="0 0 374 206" fill="none"><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor"/><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor" transform="translate(139 0)"/></svg><span class="w">infinit<span class="r">®</span></span></a>
    <span class="tag">Sobre blanc — footer</span>
    <a class="lock big"><svg viewBox="0 0 374 206" fill="none"><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor"/><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor" transform="translate(139 0)"/></svg><span class="w">infinit<span class="r">®</span></span></a>
  </div>
  <div class="panel deep">
    <span class="tag">Sobre deep #08090F — header</span>
    <a class="lock"><svg viewBox="0 0 374 206" fill="none"><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor"/><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor" transform="translate(139 0)"/></svg><span class="w">infinit<span class="r">®</span></span></a>
    <span class="tag">Sobre deep #08090F — footer</span>
    <a class="lock big"><svg viewBox="0 0 374 206" fill="none"><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor"/><path d="M 108.196 34 L 182.196 34 Q 201.196 34 194.140 51.641 L 153.056 154.359 Q 146 172 127 172 L 53 172 Q 34 172 41.056 154.359 L 82.140 51.641 Q 89.196 34 108.196 34 Z" fill="currentColor" transform="translate(139 0)"/></svg><span class="w">infinit<span class="r">®</span></span></a>
  </div>
</body>
</html>
