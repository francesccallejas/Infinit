<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinit® — Logo refine · menys corba</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@900&family=Inter:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#F4F2F0;--ink:#0B0C11;--mono:"IBM Plex Mono",monospace}
  body{font-family:"Hanken Grotesk",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:12vh}
  .lab{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(11,12,17,.5);padding:30px clamp(22px,5vw,70px)}
  .opt{padding:clamp(30px,4vh,52px) clamp(22px,5vw,70px);border-top:1px solid rgba(11,12,17,.12);display:flex;align-items:center;gap:clamp(30px,6vw,90px);flex-wrap:wrap}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);border:1px solid rgba(11,12,17,.12);border-radius:999px;padding:6px 12px;min-width:128px;text-align:center}
  .logo{display:inline-flex;align-items:center;gap:14px;color:var(--ink)}
  .logo svg{height:64px;width:auto}
  .logo .word{font-weight:900;font-size:64px;letter-spacing:-.045em;line-height:1;display:inline-flex;align-items:flex-start}
  .logo .reg{font-family:"Inter";font-weight:700;font-size:16px;margin-top:6px}
  .small{display:inline-flex;align-items:center;gap:9px}
  .small svg{height:26px}.small .word{font-size:26px}.small .reg{font-size:9px;margin-top:3px}
</style>
</head>
