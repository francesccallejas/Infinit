<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Radii & shadow</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;height:100%;}
  .frame{height:100vh;background:var(--warm-gray);color:var(--deep-blue);padding:28px 40px;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;gap:48px;}
  .group{display:flex;flex-direction:column;gap:14px;}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue-gray);}
  .swatch{width:88px;height:64px;background:#fff;border:1px solid var(--line-on-light);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--deep-blue);font-variant-numeric:tabular-nums;}
  .pill{height:36px;width:120px;border-radius:999px;border:1px solid var(--line-on-light);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .shadow{width:140px;height:84px;background:#fff;box-shadow:0 1px 2px rgba(0,7,40,0.06), 0 24px 48px -16px rgba(0,7,40,0.18);display:flex;align-items:center;justify-content:center;font-size:13px;}
</style></head>
<body>
<div class="frame">
  <div class="group"><div class="label">Radii</div>
    <div style="display:flex;gap:14px;align-items:flex-end;">
      <div class="swatch" style="border-radius:0;">0 · default</div>
      <div class="swatch" style="border-radius:4px;">4 · image</div>
      <div class="swatch" style="border-radius:6px;">6 · button</div>
      <div class="pill">999 · pill</div>
    </div>
  </div>
  <div class="group"><div class="label">Shadow (only)</div>
    <div class="shadow">shadow-pop</div>
  </div>
</div>
</body></html>
