<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Type scale — display</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;height:100%;}
  .frame{height:100vh;background:var(--warm-gray);color:var(--deep-blue);padding:24px 40px;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;gap:18px;justify-content:center;}
  .row{display:grid;grid-template-columns:120px 1fr;align-items:baseline;gap:24px;border-bottom:1px solid var(--line-on-light);padding-bottom:14px;}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue-gray);font-variant-numeric:tabular-nums;}
  .sample{letter-spacing:-0.025em;line-height:.95;font-weight:400;}
</style></head>
<body>
<div class="frame">
  <div class="row"><div class="label">Display XL · 184</div><div class="sample" style="font-size:104px">Aa</div></div>
  <div class="row"><div class="label">Display L · 128</div><div class="sample" style="font-size:82px">designed to scale.</div></div>
  <div class="row"><div class="label">Display M · 88</div><div class="sample" style="font-size:60px">Brand &amp; Strategy</div></div>
</div>
</body></html>
