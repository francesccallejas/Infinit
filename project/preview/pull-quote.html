<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Pull quote</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;height:100%;}
  .frame{height:100vh;background:var(--warm-gray);color:var(--deep-blue);padding:40px 56px;font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;}
  .quote{font-size:38px;letter-spacing:-.018em;line-height:1.15;font-weight:400;max-width:14ch;}
  .quote em{color:var(--light-blue);font-style:normal;}
</style></head>
<body>
<div class="frame">
  <div class="quote">We don't build brands for today. We build brands prepared for <em>what's next.</em></div>
</div>
</body></html>
