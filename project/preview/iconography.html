<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;height:100%;}
  .frame{height:100vh;background:var(--warm-gray);color:var(--deep-blue);padding:28px 40px;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;gap:24px;justify-content:center;}
  .row{display:grid;grid-template-columns:160px 1fr;align-items:center;gap:24px;}
  .label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-gray);}
  .glyphs{display:flex;gap:20px;align-items:center;font-size:24px;color:var(--deep-blue);}
  .glyphs span{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border:1px solid var(--line-on-light);border-radius:6px;}
  .icons{display:flex;gap:14px;align-items:center;}
  .icons svg{width:24px;height:24px;stroke:var(--deep-blue);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .note{font-size:12.5px;color:var(--blue-gray);max-width:60ch;}
</style></head>
<body>
<div class="frame">
  <div class="row"><div class="label">Brand glyphs</div>
    <div class="glyphs">
      <span>ⓒ</span><span>→</span><span>•</span><span>—</span><span>·</span>
    </div>
  </div>
  <div class="row"><div class="label">Functional UI · Lucide</div>
    <div class="icons">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 3v18"/></svg>
    </div>
  </div>
  <div class="row"><div class="label">Notes</div>
    <div class="note">No bespoke icon family. Lucide is the substitute (flagged). Emoji never used. Decorative imagery is carried by type and space, not iconography.</div>
  </div>
</div>
</body></html>
