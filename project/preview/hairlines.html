<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Hairline divider system</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;height:100%;}
  .frame{height:100vh;background:var(--warm-gray);color:var(--deep-blue);padding:28px 40px;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;gap:18px;}
  .row{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:18px;}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue-gray);}
  hr{margin:0;border:0;width:100%;}
  .h1{border-top:1px solid rgba(0,7,40,.08);}
  .h2{border-top:1px solid rgba(0,7,40,.16);}
  .h3{border-top:1px solid rgba(0,7,40,.32);}
  .h4{border-top:1px solid var(--deep-blue);}
  .h5{border-top:1px dashed rgba(0,7,40,.32);}
  .sample{padding:12px 0;border-top:1px solid rgba(0,7,40,.12);}
</style></head>
<body>
<div class="frame">
  <div class="row"><div class="label">8% — sub</div><hr class="h1"/></div>
  <div class="row"><div class="label">16% — default</div><hr class="h2"/></div>
  <div class="row"><div class="label">32% — strong</div><hr class="h3"/></div>
  <div class="row"><div class="label">100% — ink</div><hr class="h4"/></div>
  <div class="row"><div class="label">Dashed</div><hr class="h5"/></div>
  <div class="row"><div class="label">In situ</div>
    <div>
      <div class="sample">Strategy<span style="float:right;color:var(--blue-gray)">01</span></div>
      <div class="sample">Identity<span style="float:right;color:var(--blue-gray)">02</span></div>
      <div class="sample" style="border-bottom:1px solid rgba(0,7,40,.12);padding-bottom:12px;">Digital<span style="float:right;color:var(--blue-gray)">03</span></div>
    </div>
  </div>
</div>
</body></html>
