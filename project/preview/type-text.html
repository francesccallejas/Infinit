<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Type scale — text</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;height:100%;}
  .frame{height:100vh;background:var(--warm-gray);color:var(--deep-blue);padding:24px 40px;font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;gap:14px;justify-content:center;}
  .row{display:grid;grid-template-columns:120px 1fr;align-items:baseline;gap:24px;border-bottom:1px solid var(--line-on-light);padding-bottom:10px;}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue-gray);font-variant-numeric:tabular-nums;}
  .h1{font-size:48px;font-weight:400;letter-spacing:-0.02em;line-height:1.05;}
  .h2{font-size:34px;font-weight:500;letter-spacing:-0.015em;line-height:1.1;}
  .h3{font-size:22px;font-weight:500;letter-spacing:-0.01em;}
  .body{font-size:16px;line-height:1.55;}
  .cap{font-size:12px;color:var(--blue-gray);}
  .tag{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:500;}
</style></head>
<body>
<div class="frame">
  <div class="row"><div class="label">H1 · 64</div><div class="h1">The discipline behind growth.</div></div>
  <div class="row"><div class="label">H2 · 44</div><div class="h2">Structure made visible.</div></div>
  <div class="row"><div class="label">H3 · 28</div><div class="h3">Our approach.</div></div>
  <div class="row"><div class="label">Body · 17</div><div class="body">We build strategic direction that aligns business ambition, market opportunity and execution.</div></div>
  <div class="row"><div class="label">Caption · 13</div><div class="cap">Fractional or Interim CMO · Strategy</div></div>
  <div class="row"><div class="label">Tag · 12</div><div class="tag">Our Services</div></div>
</div>
</body></html>
