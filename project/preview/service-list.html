<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>Service list (long-form)</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;height:100%;}
  .frame{height:100vh;background:var(--warm-gray);color:var(--deep-blue);padding:24px 40px;font-family:Inter,system-ui,sans-serif;display:grid;grid-template-columns:200px 1fr;gap:48px;align-items:start;align-content:center;}
  .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-gray);}
  .head{font-size:30px;line-height:1.1;letter-spacing:-.015em;margin-top:8px;}
  ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px 32px;font-size:14px;}
  li{display:flex;gap:10px;align-items:baseline;border-top:1px solid var(--line-on-light);padding-top:10px;}
  li .n{color:var(--blue-gray);font-variant-numeric:tabular-nums;font-size:11px;}
</style></head>
<body>
<div class="frame">
  <div><div class="eyebrow">Identity</div><div class="head">Structure made visible.</div></div>
  <ul>
    <li><span class="n">01</span>Visual Identity</li>
    <li><span class="n">02</span>Verbal Identity</li>
    <li><span class="n">03</span>Naming</li>
    <li><span class="n">04</span>Art Direction</li>
    <li><span class="n">05</span>Motion Systems</li>
    <li><span class="n">06</span>Design Systems</li>
    <li><span class="n">07</span>Brand Guidelines</li>
    <li><span class="n">08</span>Presentation Systems</li>
    <li><span class="n">09</span>Campaign Concepts</li>
    <li><span class="n">10</span>Creative Direction</li>
  </ul>
</div>
</body></html>
